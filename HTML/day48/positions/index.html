<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <h1> css positions</h1>
    <div class="parent">
        <div class="children-static">a</div>
        <div id="static-special" class="children-static">b</div>
        <div class="children-static">c</div>
        <div class="children-static">d</div>
    </div>

<!-- now relative position -->

<div class="parent">
    <div class="children-relative">e</div>
    <div id="relative-special" class="children-relative">f</div>
    <div class="children-relative">g</div>
    <div class="children-relative">h</div>
</div>


<!-- absolute special -->
 <div class="parent">
    <div class="children-absolute">i</div>
    <div id="absolute-special" class="children-absolute">j</div>
    <div class="children-absolute">k</div>
    <div class="children-absolute">l</div>
 </div>


</body>
</html>
