<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        #box{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap:5px;
        }
        .card{
            background-color: bisque;
            height: 30vh;
        }
        #cart{
            height: 20vh;
            width: 40vw;
            background-color: aqua;
            border: 5px solid black;
        }
    </style>
    <h1>Event deligation</h1>

    <main id="box">
        <article class="card">ice-cream</article>
        <article class="card">milk</article>
        <article class="card">dahi</article>
        <article class="card">pepsi</article>
        <article class="card">magi</article>
        <article class="card">choco</article>
        <article class="card">cake</article>
        <article class="card">kinder-joy</article>
        
    </main>

    <footer id="cart"></footer>

    <!-- <textarea id="cart" name="" id=""></textarea> -->




    <script src="app.js" ></script>
</body>
</html>
