<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="style.css">
<body style="background-color: lightblue;">

    <div style="display: flex;align-items: center; justify-content: center; background-color: blueviolet; height: 100vh; width: 100vw; border: 2px solid yellow">

   <div style="display: flex;border: 1px solid black; height: 30vh; width: 40vh;padding: 80px; background-color: whitesmoke;flex-direction: column; gap: 10px;border: 2px solid yellow;">

    <span id="dis" style="height: 10vh; width: 100%; border: 1px solid black; display: flex; justify-content: end; align-items: end; font-size: 200%; color: blue;" >0</span>

    <div style="display: flex; flex-direction: row; justify-content: space-evenly;">

    <button id="btnplus" style="display: flex;font-size: larger;height: 5vh; width: 5vw; border-radius: 50%; align-items: center;justify-content: center;background-color: aquamarine;" >+</button>
    <button id="btnreset" style="display: flex;font-size: larger;height: 5vh; width: 5vw; border-radius: 50%; align-items: center;justify-content: center;background-color: aquamarine;">R</button>
    <button id="btnminus" style="display: flex;font-size: larger;height: 5vh; width: 5vw; border-radius: 50%; align-items: center;justify-content: center;background-color: aquamarine;">-</button>
    </div>



   </div>

    </div>








    <script src="app.js"></script>
